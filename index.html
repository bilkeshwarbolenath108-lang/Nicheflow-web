<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NicheFlow</title>
<style>
  body { font-family: sans-serif; background: #FFFDF7; margin: 0; padding: 24px; color: #2B2B2B; }
  h1 { margin: 0; font-size: 30px; }
  .sub { color: #6B6B6B; margin-bottom: 24px; }
  .card { background: #fff; border-radius: 16px; padding: 18px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; }
  .good { color: #2E7D32; font-weight: 700; }
  .bad { color: #B3261E; font-weight: 700; }
</style>
</head>
<body>
<h1>NicheFlow</h1>
<div class="sub">Agency Command Center</div>
<div class="card"><b>Backend Connection</b><div id="status">Connecting...</div></div>
<div class="card"><b>Niche Workspaces</b><div id="niches">-</div></div>
<script>
const API = "https://leadgen-backend-b787.onrender.com";
fetch(API + "/health")
  .then(r => { if (!r.ok) throw new Error("Server error " + r.status); return r.json(); })
  .then(d => {
    document.getElementById("status").innerHTML =
      '<div class="row"><span>Status</span><span class="' + (d.ok ? "good" : "bad") + '">' + (d.ok ? "Connected ✓" : "Error") + '</span></div>' +
      '<div class="row"><span>Database</span><span class="' + (d.db === "postgres" ? "good" : "bad") + '">' + d.db + '</span></div>';
    document.getElementById("niches").innerHTML =
      (d.niches || []).map(n => '<div class="row">' + n + '</div>').join("");
  })
  .catch(e => {
    document.getElementById("status").innerHTML = '<div class="bad">⚠ ' + e.message + '</div>';
  });
</script>
</body>
</html>
