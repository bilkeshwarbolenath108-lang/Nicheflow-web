<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NicheFlow</title>
<style>
  body { font-family: sans-serif; background: #FFFDF7; margin: 0; padding: 24px; color: #2B2B2B; }
  h1 { margin: 0; font-size: 30px; }
  .sub { color: #6B6B6B; margin-bottom: 24px; }
  .card { background: #fff; border-radius: 16px; padding: 18px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; }
  .good { color: #2E7D32; font-weight: 700; }
  .bad { color: #B3261E; font-weight: 700; }
  .chips { margin: 12px 0; }
  .chip { display: inline-block; border: 1px solid #ccc; border-radius: 20px; padding: 6px 12px; margin: 0 6px 6px 0; font-size: 13px; background: #fff; }
  .chip.on { background: #2B2B2B; color: #fff; border-color: #2B2B2B; }
  .p { padding: 10px 0; border-bottom: 1px solid #eee; }
  .pn { font-weight: 600; }
  .pm { color: #6B6B6B; font-size: 13px; }
</style>
</head>
<body>
<h1>NicheFlow</h1>
<div class="sub">Agency Command Center</div>

<div class="card"><b>Backend</b><div id="status">Connecting...</div></div>

<div class="card">
  <b>Prospects</b> <span id="count" class="pm"></span>
  <div class="chips" id="filters"></div>
  <div id="list">Loading...</div>
</div>

<script>
const API = "https://leadgen-backend-b787.onrender.com";
let all = [];
let current = "all";

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
  });
}

function getJson(path) {
  return fetch(API + path).then(function (r) {
    if (!r.ok) throw new Error("Server error " + r.status);
    return r.json();
  });
}

function render() {
  var niches = [];
  all.forEach(function (p) {
    if (p.niche && niches.indexOf(p.niche) === -1) niches.push(p.niche);
  });

  var chips = '<span class="chip ' + (current === "all" ? "on" : "") + '" data-n="all">All (' + all.length + ')</span>';
  niches.forEach(function (n) {
    chips += '<span class="chip ' + (current === n ? "on" : "") + '" data-n="' + esc(n) + '">' + esc(n) + '</span>';
  });
  document.getElementById("filters").innerHTML = chips;

  var items = current === "all" ? all : all.filter(function (p) { return p.niche === current; });
  document.getElementById("count").textContent = "(" + items.length + ")";

  if (items.length === 0) {
    document.getElementById("list").textContent = "Koi prospect nahi mila.";
    return;
  }

  document.getElementById("list").innerHTML = items.map(function (p) {
    var name = p.business_name || p.name || p.company || p.email || ("Prospect #" + p.id);
    var meta = [p.niche, p.email, p.status].filter(Boolean).map(esc).join(" · ");
    return '<div class="p"><div class="pn">' + esc(name) + '</div><div class="pm">' + meta + '</div></div>';
  }).join("");
}

document.getElementById("filters").addEventListener("click", function (e) {
  var n = e.target.getAttribute("data-n");
  if (n) { current = n; render(); }
});

getJson("/api/health")
  .then(function (d) {
    document.getElementById("status").innerHTML =
      '<div class="row"><span>Status</span><span class="' + (d.ok ? "good" : "bad") + '">' + (d.ok ? "Connected ✓" : "Error") + '</span></div>' +
      '<div class="row"><span>Database</span><span class="' + (d.db === "postgres" ? "good" : "bad") + '">' + esc(d.db) + '</span></div>';
  })
  .catch(function (e) {
    document.getElementById("status").innerHTML = '<div class="bad">⚠ ' + esc(e.message) + '</div>';
  });

getJson("/api/prospects")
  .then(function (d) {
    all = Array.isArray(d) ? d : (d.prospects || d.data || []);
    render();
  })
  .catch(function (e) {
    document.getElementById("list").innerHTML = '<div class="bad">⚠ ' + esc(e.message) + '</div>';
  });
</script>
</body>
</html>
