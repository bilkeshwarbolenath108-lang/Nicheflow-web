<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NicheFlow</title>
<style>
  :root {
    --bg: #EEF2F0; --ink: #14231F; --mute: #5E6F69; --line: #D5DEDA;
    --card: #FFFFFF; --acc: #1B6B5A; --acc-soft: #DCEBE6; --bad: #B3261E;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px 16px 48px; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.45;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 18px; }
  h1 { margin: 0; font-size: 26px; letter-spacing: -0.5px; }
  .conn { font-size: 13px; color: var(--mute); }
  .conn b { color: var(--acc); }
  .conn.err b { color: var(--bad); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .chip { border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 8px 14px; border-radius: 999px; font-size: 14px; cursor: pointer; }
  .chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  .panel h2 { margin: 0 0 4px; font-size: 17px; }
  .count { color: var(--mute); font-weight: 400; }
  .item { padding: 14px 0; border-top: 1px solid var(--line); }
  .item:first-of-type { border-top: 0; }
  .name { font-weight: 600; }
  .meta { color: var(--mute); font-size: 13px; word-break: break-word; }
  .empty { color: var(--mute); padding: 8px 0 2px; }
  select.st { margin-top: 8px; padding: 8px 10px; border-radius: 8px; font-size: 14px; border: 1px solid var(--line); background: var(--acc-soft); color: var(--acc); font-weight: 600; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  button.mini { background: #fff; color: var(--acc); border: 1px solid var(--acc); border-radius: 8px; padding: 7px 14px; font-size: 13px; font-weight: 600; cursor: pointer; }
  button.mini.danger { color: var(--bad); border-color: var(--bad); }
  .editbox { margin-top: 12px; padding: 12px; background: #F6F9F8; border: 1px solid var(--line); border-radius: 10px; }
  .draft { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .draft textarea { min-height: 200px; }
  button.primary { width: 100%; background: var(--acc); color: #fff; border: 0; border-radius: 10px; padding: 13px; font-size: 15px; font-weight: 600; cursor: pointer; }
  button.primary:disabled { opacity: .6; cursor: default; }
  button.ghost { width: 100%; background: transparent; color: var(--acc); border: 1px solid var(--acc); border-radius: 10px; padding: 12px; font-size: 15px; font-weight: 600; cursor: pointer; margin-bottom: 14px; }
  label { display: block; font-size: 13px; color: var(--mute); margin: 12px 0 4px; }
  input, textarea, select.f { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 11px; font-size: 15px; font-family: inherit; background: #fff; color: var(--ink); }
  textarea { min-height: 110px; resize: vertical; }
  .tools { display: flex; gap: 8px; margin: 12px 0 4px; }
  .tools input { flex: 2; }
  .tools select { flex: 1; }
  .hint { font-size: 12px; color: var(--mute); margin-top: 4px; }
  .msg { margin-top: 12px; font-size: 14px; }
  .msg.ok { color: var(--acc); }
  .msg.bad { color: var(--bad); }
  .hidden { display: none; }
  .split { height: 1px; background: var(--line); margin: 18px 0 6px; }
  .foot { display: flex; gap: 10px; margin-top: 14px; }
  #login { position: fixed; inset: 0; background: var(--bg); z-index: 10; display: flex; align-items: center; justify-content: center; padding: 20px; }
  #login .box { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 22px; width: 100%; max-width: 380px; }
  #login h2 { margin: 0 0 6px; }
</style>
</head>
<body>

<div id="login" class="hidden">
  <div class="box">
    <h2>NicheFlow login</h2>
    <div class="hint">Apna app password daalo.</div>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password">
    <div style="height:14px"></div>
    <button class="primary" id="loginBtn">Login</button>
    <div class="msg bad" id="loginMsg"></div>
  </div>
</div>

<div class="wrap">
  <header>
    <h1>NicheFlow</h1>
    <div class="conn" id="conn">Backend se jud raha hai...</div>
  </header>

  <div class="chips" id="chips"></div>

  <button class="ghost" id="toggle">+ Prospect jodo</button>

  <div class="panel hidden" id="addPanel">
    <h2>Naya prospect (<span id="addNiche">-</span>)</h2>
    <label for="f_business">Business ka naam *</label>
    <input id="f_business" autocomplete="off">
    <label for="f_contact">Owner / contact ka naam</label>
    <input id="f_contact" autocomplete="off">
    <label for="f_email">Email *</label>
    <input id="f_email" type="email" autocomplete="off">
    <label for="f_phone">Phone</label>
    <input id="f_phone" autocomplete="off">
    <label for="f_website">Website</label>
    <input id="f_website" autocomplete="off">
    <label for="f_city">City</label>
    <input id="f_city" autocomplete="off">
    <label for="f_country">Country</label>
    <input id="f_country" autocomplete="off">
    <div style="height:14px"></div>
    <button class="primary" id="saveOne">Prospect save karo</button>

    <div class="split"></div>

    <h2>Bahut saare ek saath</h2>
    <label for="bulk">Har line mein ek prospect</label>
    <textarea id="bulk" placeholder="Business, Contact, Email, City, Country"></textarea>
    <div class="hint">Format: Business, Contact, Email, City, Country. Email zaroori hai. Duplicate email apne aap skip ho jayegi.</div>
    <div style="height:12px"></div>
    <button class="primary" id="saveBulk">Sab import karo</button>

    <div class="msg" id="msg"></div>
  </div>

  <div class="panel">
    <h2>Prospects <span class="count" id="count"></span></h2>
    <div class="tools">
      <input id="q" placeholder="Search: naam, email, city" autocomplete="off">
      <select class="f" id="fstatus"></select>
    </div>
    <div id="list"><div class="empty">Niche chuno.</div></div>
    <div class="msg" id="listMsg"></div>
    <div class="foot">
      <button class="mini" id="csv">CSV download</button>
      <button class="mini danger" id="logout">Logout</button>
    </div>
  </div>
</div>

<script>
const API = "https://leadgen-backend-b787.onrender.com";
const STATUSES = ["not_contacted", "draft_ready", "approved", "sent", "replied", "interested",
  "meeting_optional", "proposal_sent", "won", "lost", "unsubscribed", "bounced"];
const FIELDS = [
  ["businessName", "business_name", "Business ka naam", "text"],
  ["contactName", "contact_name", "Contact ka naam", "text"],
  ["email", "email", "Email", "email"],
  ["phone", "phone", "Phone", "text"],
  ["website", "website", "Website", "text"],
  ["city", "city", "City", "text"],
  ["country", "country", "Country", "text"],
  ["nextFollowUp", "next_follow_up", "Agla follow-up", "date"]
];
let niches = [];
let current = null;
let timer = null;
let PW = localStorage.getItem("nf_pw") || "";

const $ = (id) => document.getElementById(id);

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}
function label(s) { return String(s).replace(/_/g, " "); }

// ---------- login ----------
function showLogin(text) {
  PW = "";
  localStorage.removeItem("nf_pw");
  $("loginMsg").textContent = text || "";
  $("login").classList.remove("hidden");
}
function hideLogin() { $("login").classList.add("hidden"); }

async function api(path, options) {
  options = options || {};
  options.headers = Object.assign({}, options.headers, { "x-app-password": PW });
  const res = await fetch(API + path, options);
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (res.status === 401) {
    showLogin((data && data.error) || "Password chahiye");
    throw new Error("Login chahiye");
  }
  if (!res.ok) throw new Error((data && data.error) || ("Server error " + res.status));
  return data;
}
function jsonOpts(method, body) {
  return { method: method, headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) };
}

function say(text, kind) { const m = $("msg"); m.textContent = text; m.className = "msg " + (kind || ""); }
function sayList(text, kind) { const m = $("listMsg"); m.textContent = text; m.className = "msg " + (kind || ""); }

// ---------- prospects list ----------
function renderChips() {
  $("chips").innerHTML = niches.map((n) =>
    '<button class="chip ' + (n === current ? "on" : "") + '" data-n="' + esc(n) + '">' + esc(n) + '</button>'
  ).join("");
  $("addNiche").textContent = current || "-";
}

function statusSelect(p) {
  const cur = p.status || "not_contacted";
  const opts = STATUSES.indexOf(cur) === -1 ? STATUSES.concat([cur]) : STATUSES;
  return '<select class="st" data-id="' + esc(p.id) + '">' +
    opts.map((s) => '<option value="' + esc(s) + '"' + (s === cur ? " selected" : "") + '>' + esc(label(s)) + '</option>').join("") +
    '</select>';
}

function editBox(p) {
  return '<div class="editbox hidden" data-box="' + esc(p.id) + '">' +
    FIELDS.map((f) => {
      const raw = p[f[1]];
      const val = f[3] === "date" ? String(raw || "").slice(0, 10) : raw;
      return '<label>' + esc(f[2]) + '</label><input data-f="' + f[0] + '" type="' + f[3] + '" value="' + esc(val) + '">';
    }).join("") +
    '<div class="actions">' +
    '<button class="mini" data-act="save" data-id="' + esc(p.id) + '">Save</button>' +
    '<button class="mini" data-act="cancel" data-id="' + esc(p.id) + '">Cancel</button>' +
    '</div></div>';
}

function mailBox(p) {
  const id = esc(p.id);
  return '<div class="editbox hidden" data-mbox="' + id + '">' +
    '<label>Instruction (Hinglish mein)</label>' +
    '<textarea data-instr="' + id + '" placeholder="Jaise: isko free demo video offer karo"></textarea>' +
    '<div style="height:10px"></div>' +
    '<button class="mini" data-act="gen" data-id="' + id + '">Draft banao</button>' +
    '<div class="msg" data-gmsg="' + id + '"></div>' +
    '<div data-dbox="' + id + '"></div>' +
    '</div>';
}

async function loadList() {
  if (!current) return;
  $("count").textContent = "";
  sayList("");
  $("list").innerHTML = '<div class="empty">Load ho raha hai...</div>';
  try {
    const params = new URLSearchParams();
    if ($("q").value.trim()) params.set("q", $("q").value.trim());
    if ($("fstatus").value) params.set("status", $("fstatus").value);
    const qs = params.toString() ? "?" + params.toString() : "";
    const d = await api("/api/prospects/" + encodeURIComponent(current) + qs);
    const items = d.prospects || [];
    $("count").textContent = "(" + items.length + ")";
    if (!items.length) {
      $("list").innerHTML = '<div class="empty">Koi prospect nahi mila.</div>';
      return;
    }
    $("list").innerHTML = items.map((p) => {
      const meta = [p.contact_name, p.email, p.phone, p.city, p.country].filter(Boolean).map(esc).join(" · ");
      const extra = ["Score " + (p.lead_score || 0) + "/100"];
      if (p.next_follow_up) extra.push("Follow-up " + String(p.next_follow_up).slice(0, 10));
      const id = esc(p.id);
      return '<div class="item">' +
        '<div class="name">' + esc(p.business_name || p.email || "Prospect") + '</div>' +
        '<div class="meta">' + meta + '</div>' +
        '<div class="meta">' + esc(extra.join(" · ")) + '</div>' +
        statusSelect(p) +
        '<div class="actions">' +
        '<button class="mini" data-act="edit" data-id="' + id + '">Edit</button>' +
        '<button class="mini" data-act="mail" data-id="' + id + '">Email likho</button>' +
        '<button class="mini danger" data-act="delete" data-id="' + id + '">Delete</button>' +
        '</div>' +
        editBox(p) + mailBox(p) +
        '</div>';
    }).join("");
  } catch (e) {
    if (e.message !== "Login chahiye") $("list").innerHTML = '<div class="msg bad">Load nahi hua: ' + esc(e.message) + '</div>';
  }
}

function pick(n) {
  current = n;
  $("q").value = "";
  $("fstatus").value = "";
  renderChips();
  say("");
  loadList();
}

// ---------- drafts (composer) ----------
function draftHtml(dr) {
  const id = esc(dr.id), pid = esc(dr.prospect_id);
  return '<div class="draft">' +
    '<div class="meta">' + (dr.adapter === "test" ? "Test AI Adapter (asli AI nahi) · " : "") + esc(label(dr.status)) + '</div>' +
    '<label>Subject</label><input data-dsub="' + id + '" value="' + esc(dr.subject) + '">' +
    '<label>Email</label><textarea data-dbody="' + id + '">' + esc(dr.body) + '</textarea>' +
    '<div class="actions">' +
    '<button class="mini" data-act="dsave" data-id="' + pid + '" data-did="' + id + '">Save</button>' +
    '<button class="mini" data-act="dapprove" data-id="' + pid + '" data-did="' + id + '">Approve</button>' +
    '<button class="mini danger" data-act="ddel" data-id="' + pid + '" data-did="' + id + '">Delete</button>' +
    '</div>' +
    '<div class="msg" data-dmsg="' + id + '"></div>' +
    '</div>';
}

async function loadDrafts(pid) {
  const box = document.querySelector('[data-dbox="' + pid + '"]');
  if (!box) return;
  box.innerHTML = '<div class="empty">Load ho raha hai...</div>';
  try {
    const d = await api("/api/drafts/" + encodeURIComponent(current) + "?prospectId=" + encodeURIComponent(pid));
    const drafts = d.drafts || [];
    box.innerHTML = drafts.length ? drafts.map(draftHtml).join("") : '<div class="empty">Abhi koi draft nahi.</div>';
  } catch (e) {
    if (e.message !== "Login chahiye") box.innerHTML = '<div class="msg bad">' + esc(e.message) + '</div>';
  }
}

function setMsg(selector, text, kind) {
  const m = document.querySelector(selector);
  if (m) { m.textContent = text; m.className = "msg " + (kind || ""); }
}

async function saveDraft(did) {
  const subject = document.querySelector('[data-dsub="' + did + '"]').value;
  const body = document.querySelector('[data-dbody="' + did + '"]').value;
  await api("/api/drafts/" + encodeURIComponent(did), jsonOpts("PATCH", { niche: current, subject: subject, body: body }));
}

// ---------- events ----------
$("chips").addEventListener("click", (e) => {
  const n = e.target.getAttribute("data-n");
  if (n) pick(n);
});

$("q").addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(loadList, 350); });
$("fstatus").addEventListener("change", loadList);

$("list").addEventListener("change", async (e) => {
  const sel = e.target;
  if (!sel.classList.contains("st")) return;
  const id = sel.getAttribute("data-id");
  sel.disabled = true;
  try {
    await api("/api/prospects/" + encodeURIComponent(id) + "/status", jsonOpts("PATCH", { niche: current, status: sel.value }));
    sayList("Status badal gaya: " + label(sel.value), "ok");
  } catch (err) {
    if (err.message !== "Login chahiye") { sayList("Status nahi badla: " + err.message, "bad"); loadList(); }
  } finally {
    sel.disabled = false;
  }
});

$("list").addEventListener("click", async (e) => {
  const btn = e.target.closest("button[data-act]");
  if (!btn) return;
  const act = btn.getAttribute("data-act");
  const id = btn.getAttribute("data-id");
  const did = btn.getAttribute("data-did");
  const box = document.querySelector('[data-box="' + id + '"]');
  const mbox = document.querySelector('[data-mbox="' + id + '"]');

  try {
    if (act === "edit") { box.classList.remove("hidden"); return; }
    if (act === "cancel") { box.classList.add("hidden"); return; }

    if (act === "save") {
      const body = { niche: current };
      box.querySelectorAll("input[data-f]").forEach((inp) => { body[inp.getAttribute("data-f")] = inp.value.trim(); });
      btn.disabled = true;
      try {
        await api("/api/prospects/" + encodeURIComponent(id), jsonOpts("PATCH", body));
        sayList("Save ho gaya.", "ok");
        loadList();
      } finally { btn.disabled = false; }
      return;
    }

    if (act === "delete") {
      if (!confirm("Ye prospect hamesha ke liye hat jayega. Pakka?")) return;
      await api("/api/prospects/" + encodeURIComponent(id) + "?niche=" + encodeURIComponent(current), { method: "DELETE" });
      sayList("Hat gaya.", "ok");
      loadList();
      return;
    }

    if (act === "mail") {
      mbox.classList.toggle("hidden");
      if (!mbox.classList.contains("hidden")) loadDrafts(id);
      return;
    }

    if (act === "gen") {
      const instr = document.querySelector('[data-instr="' + id + '"]').value.trim();
      btn.disabled = true;
      setMsg('[data-gmsg="' + id + '"]', "Draft ban raha hai...", "");
      try {
        await api("/api/drafts/generate", jsonOpts("POST", { niche: current, prospectId: id, instruction: instr }));
        setMsg('[data-gmsg="' + id + '"]', "Draft ban gaya (Test AI Adapter, asli AI nahi). Neeche edit karo.", "ok");
        await loadDrafts(id);
      } finally { btn.disabled = false; }
      return;
    }

    if (act === "dsave") {
      await saveDraft(did);
      setMsg('[data-dmsg="' + did + '"]', "Save ho gaya.", "ok");
      return;
    }

    if (act === "dapprove") {
      await saveDraft(did);
      await api("/api/drafts/" + encodeURIComponent(did) + "/approve", jsonOpts("POST", { niche: current }));
      await loadDrafts(id);
      setMsg('[data-gmsg="' + id + '"]', "Approve ho gaya. (Abhi email bhejna chalu nahi hai.)", "ok");
      return;
    }

    if (act === "ddel") {
      if (!confirm("Ye draft hat jayega. Pakka?")) return;
      await api("/api/drafts/" + encodeURIComponent(did) + "?niche=" + encodeURIComponent(current), { method: "DELETE" });
      await loadDrafts(id);
      return;
    }
  } catch (err) {
    if (err.message === "Login chahiye") return;
    if (did) setMsg('[data-dmsg="' + did + '"]', err.message, "bad");
    else if (act === "gen") setMsg('[data-gmsg="' + id + '"]', err.message, "bad");
    else sayList(err.message, "bad");
  }
});

$("toggle").addEventListener("click", () => {
  const p = $("addPanel");
  const open = p.classList.toggle("hidden") === false;
  $("toggle").textContent = open ? "Band karo" : "+ Prospect jodo";
});

$("saveOne").addEventListener("click", async () => {
  const business = $("f_business").value.trim();
  const email = $("f_email").value.trim();
  if (!business || !email) { say("Business ka naam aur email dono zaroori hain.", "bad"); return; }
  const btn = $("saveOne");
  btn.disabled = true;
  try {
    await api("/api/prospects", jsonOpts("POST", {
      niche: current, businessName: business, contactName: $("f_contact").value.trim(),
      email: email, phone: $("f_phone").value.trim(), website: $("f_website").value.trim(),
      city: $("f_city").value.trim(), country: $("f_country").value.trim()
    }));
    ["f_business", "f_contact", "f_email", "f_phone", "f_website", "f_city", "f_country"].forEach((id) => { $(id).value = ""; });
    say("Save ho gaya (" + current + ").", "ok");
    loadList();
  } catch (e) {
    if (e.message !== "Login chahiye") say("Save nahi hua: " + e.message, "bad");
  } finally { btn.disabled = false; }
});

$("saveBulk").addEventListener("click", async () => {
  const rows = $("bulk").value.split("\n").map((l) => l.trim()).filter(Boolean).map((l) => {
    const c = l.split(",").map((x) => x.trim());
    return { businessName: c[0] || "", contactName: c[1] || "", email: c[2] || "", city: c[3] || "", country: c[4] || "" };
  }).filter((r) => r.email.indexOf("@") > 0);
  if (!rows.length) { say("Koi sahi line nahi mili. Format: Business, Contact, Email, City, Country", "bad"); return; }
  const btn = $("saveBulk");
  btn.disabled = true;
  try {
    const r = await api("/api/prospects/bulk-import", jsonOpts("POST", { niche: current, prospects: rows }));
    $("bulk").value
